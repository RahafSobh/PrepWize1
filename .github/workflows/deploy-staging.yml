name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Trigger Render staging deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_STAGING is not configured — skipping staging deploy."
            echo "Add the Render deploy hook URL to GitHub → Settings → Environments → staging."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Staging deploy triggered successfully."
